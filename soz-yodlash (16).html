<!DOCTYPE html>
<html lang="uz">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Learn with Theodore</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Sora:wght@400;600;700;800&family=Inter:wght@400;500;600;700&family=IBM+Plex+Mono:wght@500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#0A0808;
    --surface:#170F0F;
    --surface-2:#211313;
    --ink:#F2E8E6;
    --ink-soft:#A89594;
    --primary:#8F1D2C;
    --primary-deep:#5E131E;
    --primary-tint:rgba(143,29,44,0.18);
    --accent:#B9313F;
    --accent-tint:rgba(185,49,63,0.16);
    --success:#5FAE7F;
    --success-tint:rgba(95,174,127,0.14);
    --danger:#E2574C;
    --danger-tint:rgba(226,87,76,0.14);
    --line:rgba(242,232,230,0.10);
    --shadow: 0 10px 30px -14px rgba(0,0,0,0.65);
  }
  *{ margin:0; padding:0; box-sizing:border-box; }
  body{
    background:var(--bg);
    color:var(--ink);
    font-family:'Inter',sans-serif;
    min-height:100vh;
    line-height:1.5;
  }
  h1,h2,h3{ font-family:'Sora',sans-serif; }
  .mono{ font-family:'IBM Plex Mono',monospace; }

  #app{
    max-width:1120px;
    margin:0 auto;
    padding:36px 28px 90px;
  }
  .narrow{
    max-width:640px;
    margin:0 auto;
    width:100%;
  }

  /* ---------- HEADER ---------- */
  .app-header{
    display:flex;
    align-items:center;
    justify-content:space-between;
    margin-bottom:28px;
  }
  .app-title{
    font-size:1.5rem;
    font-weight:800;
    color:var(--primary-deep);
    display:flex;
    align-items:center;
    gap:12px;
  }
  .avatar{
    width:44px;height:44px;
    border-radius:50%;
    object-fit:cover;
    object-position:center 30%;
    border:2px solid var(--surface);
    box-shadow:0 0 0 2px var(--accent);
    flex-shrink:0;
  }
  .app-title .dot{
    width:10px;height:10px;border-radius:50%;
    background:var(--accent);
  }
  .header-stat{
    font-family:'IBM Plex Mono',monospace;
    font-size:0.85rem;
    color:var(--ink-soft);
    background:var(--surface);
    border:1px solid var(--line);
    padding:6px 12px;
    border-radius:999px;
  }

  /* ---------- PATH (signature element) ---------- */
  .path-track{
    display:flex;
    align-items:center;
    gap:0;
    margin-bottom:36px;
    overflow-x:auto;
    padding:6px 2px 14px;
  }
  .path-node{
    display:flex;
    align-items:center;
    flex-shrink:0;
  }
  .bead{
    width:34px;height:34px;
    border-radius:50%;
    display:flex;align-items:center;justify-content:center;
    font-family:'IBM Plex Mono',monospace;
    font-size:12px;
    font-weight:600;
    flex-shrink:0;
    border:2px solid var(--line);
    background:var(--surface);
    color:var(--ink-soft);
    transition: all .3s ease;
  }
  .bead.mastered{
    background:var(--success);
    border-color:var(--success);
    color:#fff;
  }
  .bead.current{
    border-color:var(--accent);
    color:var(--accent);
    box-shadow:0 0 0 4px var(--accent-tint);
    animation:beadPulse 2s ease-in-out infinite;
  }
  .bead.checkpoint{
    border-radius:8px;
    background:var(--primary-tint);
    border-color:var(--primary);
    color:var(--primary);
  }
  .bead.checkpoint.mastered{
    background:var(--primary);
    border-color:var(--primary);
    color:#fff;
  }
  @keyframes beadPulse{
    0%,100%{ box-shadow:0 0 0 4px var(--accent-tint); }
    50%{ box-shadow:0 0 0 8px var(--accent-tint); }
  }
  .thread{
    width:20px;height:2px;
    background:var(--line);
    flex-shrink:0;
  }
  .thread.done{ background:var(--success); }

  /* ---------- CARDS / BUTTONS ---------- */
  .card{
    background:var(--surface);
    border:1px solid var(--line);
    border-radius:18px;
    padding:22px;
    margin-bottom:14px;
    box-shadow:var(--shadow);
  }
  .btn{
    font-family:'Inter';
    font-weight:600;
    font-size:0.92rem;
    padding:12px 20px;
    border-radius:12px;
    border:1px solid transparent;
    cursor:pointer;
    display:inline-flex;
    align-items:center;
    gap:8px;
    transition: transform .2s ease, box-shadow .2s ease, background .2s ease, opacity .2s ease;
  }
  .btn:active{ transform: scale(0.97); }
  .btn-primary{ background:var(--primary); color:#fff; }
  .btn-primary:hover{ background:var(--primary-deep); }
  .btn-accent{ background:var(--accent); color:#fff; }
  .btn-accent:hover{ filter:brightness(1.06); }
  .btn-ghost{ background:transparent; border-color:var(--line); color:var(--ink); }
  .btn-ghost:hover{ border-color:var(--primary); color:var(--primary); }
  .btn-danger{ background:transparent; color:var(--danger); border-color:var(--danger-tint); }
  .btn-danger:hover{ background:var(--danger-tint); }
  .btn:disabled{ opacity:0.45; cursor:not-allowed; }
  .btn-block{ width:100%; justify-content:center; }
  .btn-sm{ padding:8px 14px; font-size:0.82rem; border-radius:9px; }

  .row{ display:flex; gap:10px; flex-wrap:wrap; }
  .row-between{ display:flex; align-items:center; justify-content:space-between; gap:10px; }

  input[type=text]{
    font-family:'Inter';
    font-size:0.95rem;
    padding:12px 14px;
    border-radius:11px;
    border:1px solid var(--line);
    background:var(--surface);
    color:var(--ink);
    outline:none;
    flex:1;
    min-width:0;
  }
  input[type=text]:focus{ border-color:var(--primary); box-shadow:0 0 0 3px var(--primary-tint); }

  /* ---------- NAV BOXES (O'rganish / Quiz / Nishonlar / Reyting / Xato so'zlar) ---------- */
  .nav-boxes{
    display:grid;
    grid-template-columns:repeat(auto-fit,minmax(140px,1fr));
    gap:12px;
    margin-bottom:22px;
  }
  .nav-box{
    background:var(--surface);
    border:1px solid var(--line);
    border-radius:14px;
    padding:18px 14px;
    text-align:center;
    cursor:pointer;
    box-shadow:var(--shadow);
    transition: all .2s ease;
  }
  .nav-box:hover{
    border-color:var(--primary);
    transform: translateY(-2px);
  }
  .nav-box-icon{ font-size:1.8rem; margin-bottom:8px; }
  .nav-box-name{ font-family:'Sora'; font-weight:700; font-size:0.92rem; margin-bottom:4px; }
  .nav-box-meta{ font-size:0.72rem; color:var(--ink-soft); }

  /* ---------- LEARN ROW (word + definition + translation + mic) ---------- */
  .learn-row{
    align-items:flex-start;
    gap:10px;
  }
  .learn-row-text{ flex:1; min-width:0; }
  .learn-row-text .term{ font-family:'Sora'; font-weight:700; font-size:1.02rem; }
  .learn-row-text .defn{ color:var(--ink-soft); font-size:0.85rem; margin-top:2px; line-height:1.4; }
  .learn-row-text .translation{ color:var(--primary); font-size:0.88rem; margin-top:3px; font-weight:600; }
  .learn-row-actions{ display:flex; align-items:center; gap:4px; flex-shrink:0; }
  .mic-btn{
    width:36px; height:36px; border-radius:50%;
    border:1px solid var(--line); background:var(--surface-2);
    color:var(--ink); cursor:pointer; font-size:0.95rem;
    display:flex; align-items:center; justify-content:center;
    transition: all .2s ease; flex-shrink:0;
  }
  .mic-btn:hover{ background:var(--accent); border-color:var(--accent); color:#fff; }

  .goal-track{
    height:9px; border-radius:6px; background:var(--surface-2); overflow:hidden;
  }
  .goal-fill{
    height:100%; border-radius:6px;
    background: linear-gradient(90deg, var(--primary-deep), var(--primary));
    transition: width .5s ease;
  }

  .admin-gate{
    display:flex; align-items:center; justify-content:space-between; gap:12px; flex-wrap:wrap;
  }

  /* ---------- BADGES / NISHONLAR ---------- */
  .badge-grid{
    display:grid; grid-template-columns:repeat(auto-fill,minmax(120px,1fr)); gap:14px;
  }
  .badge-item{
    background:var(--surface); border:1px solid var(--line); border-radius:14px;
    padding:18px 10px; text-align:center; box-shadow:var(--shadow);
    opacity:0.4; transition: all .25s ease;
  }
  .badge-item.earned{ opacity:1; border-color:var(--primary); }
  .badge-glyph{ font-size:1.9rem; margin-bottom:8px; }
  .badge-name{ font-family:'Sora'; font-weight:700; font-size:0.8rem; color:var(--ink); }
  .badge-locked-label{ font-size:0.68rem; color:var(--ink-soft); margin-top:4px; }

  /* ---------- HOME / GROUP LIST ---------- */
  .groups-grid{
    display:grid;
    grid-template-columns:repeat(auto-fill, minmax(260px, 1fr));
    gap:14px;
    align-items:stretch;
  }
  .discussion-card{
    background:linear-gradient(135deg, var(--primary-tint), var(--accent-tint));
    border:1px solid var(--line);
  }
  .group-card{
    display:flex;
    flex-direction:column;
    justify-content:space-between;
    width:100%;
    height:100%;
    min-height:96px;
    text-align:left;
    background:var(--surface);
    border:1px solid var(--line);
    border-radius:16px;
    padding:18px 20px;
    cursor:pointer;
    transition: transform .2s ease, border-color .2s ease;
  }
  .group-card:hover{ border-color:var(--primary); transform:translateY(-2px); }
  .group-card.locked{ cursor:not-allowed; opacity:0.6; }
  .group-card.locked:hover{ transform:none; border-color:var(--line); }
  .group-card .gc-top{ display:flex; align-items:flex-start; justify-content:space-between; gap:10px; margin-bottom:6px; }
  .group-card .gc-name{ font-family:'Sora'; font-weight:700; font-size:1.05rem; }
  .group-card.checkpoint-card{
    grid-column: 1 / -1;
  }
  .badge{
    font-size:0.72rem;
    font-weight:700;
    padding:4px 10px;
    border-radius:999px;
    text-transform:uppercase;
    letter-spacing:0.04em;
    white-space:nowrap;
  }
  .badge-locked{ background:var(--surface-2); color:var(--ink-soft); }
  .badge-open{ background:var(--accent-tint); color:var(--accent); }
  .badge-done{ background:var(--success-tint); color:var(--success); }
  .gc-meta{ font-size:0.85rem; color:var(--ink-soft); }

  .checkpoint-card{
    background:var(--primary-tint);
    border:1px dashed var(--primary);
  }
  .checkpoint-card .gc-name{ color:var(--primary-deep); }

  .empty-state{
    text-align:center;
    padding:50px 20px;
    color:var(--ink-soft);
  }
  .empty-state h3{ color:var(--ink); margin-bottom:8px; }

  /* ---------- WORD LIST ---------- */
  .word-row{
    display:flex;
    align-items:center;
    justify-content:space-between;
    padding:11px 4px;
    border-bottom:1px solid var(--line);
  }
  .word-row:last-child{ border-bottom:none; }
  .word-row .term{ font-weight:600; }
  .word-row .arrow{ color:var(--ink-soft); margin:0 8px; }
  .word-row .translation{ color:var(--ink-soft); flex:1; }
  .word-del{
    background:none;border:none;cursor:pointer;
    color:var(--ink-soft);font-size:1.1rem;line-height:1;
    padding:4px 8px;border-radius:6px;
  }
  .word-del:hover{ color:var(--danger); background:var(--danger-tint); }

  .back-link{
    display:inline-flex;align-items:center;gap:6px;
    color:var(--ink-soft); background:none;border:none;
    font-family:'Inter';font-weight:600;font-size:0.9rem;
    cursor:pointer; margin-bottom:18px; padding:4px 0;
  }
  .back-link:hover{ color:var(--primary); }

  .section-title{
    font-size:0.78rem;
    text-transform:uppercase;
    letter-spacing:0.08em;
    color:var(--ink-soft);
    font-weight:700;
    margin:22px 0 10px;
  }

  /* ---------- FLASHCARD ---------- */
  .flash-stage{
    display:flex;flex-direction:column;align-items:center;
    padding:20px 0 8px;
  }
  .flash-progress{
    font-family:'IBM Plex Mono'; font-size:0.85rem; color:var(--ink-soft);
    margin-bottom:18px;
  }
  .flashcard{
    width:100%;
    max-width:420px;
    height:240px;
    perspective:1200px;
    cursor:pointer;
  }
  .flashcard-inner{
    position:relative;
    width:100%;height:100%;
    transition:transform .5s cubic-bezier(.4,.2,.2,1);
    transform-style:preserve-3d;
  }
  .flashcard.flipped .flashcard-inner{ transform:rotateY(180deg); }
  .flash-face{
    position:absolute; inset:0;
    display:flex;align-items:center;justify-content:center;
    flex-direction:column;
    gap:10px;
    border-radius:20px;
    backface-visibility:hidden;
    padding:24px;
    text-align:center;
    box-shadow:var(--shadow);
  }
  .flash-front{ background:var(--primary); color:#fff; }
  .flash-back{ background:var(--accent); color:#fff; transform:rotateY(180deg); }
  .flash-face .label{ font-size:0.72rem; text-transform:uppercase; letter-spacing:0.1em; opacity:0.75; }
  .flash-face .word{ font-family:'Sora'; font-weight:700; font-size:1.7rem; }
  .flash-hint{ font-size:0.8rem; color:var(--ink-soft); margin-top:14px; }
  .flash-controls{ display:flex; gap:10px; margin-top:22px; }

  /* ---------- MATCH GAME ---------- */
  .match-grid{ display:grid; grid-template-columns:1fr 1fr; gap:20px; margin-top:8px; }
  .match-col{ display:flex; flex-direction:column; gap:10px; }
  .match-item{
    background:var(--surface);
    border:2px solid var(--line);
    border-radius:12px;
    padding:13px 14px;
    font-weight:600;
    font-size:0.92rem;
    text-align:center;
    cursor:pointer;
    transition: all .2s ease;
  }
  .match-item:hover{ border-color:var(--primary); }
  .match-item.selected{ border-color:var(--primary); background:var(--primary-tint); }
  .match-item.solved{ border-color:var(--success); background:var(--success-tint); color:var(--success); cursor:default; opacity:0.7; }
  .match-item.wrong{ border-color:var(--danger); background:var(--danger-tint); animation:shake .35s ease; }
  @keyframes shake{
    0%,100%{ transform:translateX(0); }
    25%{ transform:translateX(-5px); }
    75%{ transform:translateX(5px); }
  }
  .match-status{ text-align:center; margin-top:20px; color:var(--ink-soft); font-size:0.9rem; }

  /* ---------- QUIZ ---------- */
  .quiz-progress-bar{
    height:6px; background:var(--surface-2); border-radius:999px; overflow:hidden; margin-bottom:20px;
  }
  .quiz-progress-fill{ height:100%; background:var(--accent); transition:width .3s ease; }
  .quiz-q{ font-family:'Sora'; font-weight:700; font-size:1.2rem; margin-bottom:22px; text-align:center; }
  .quiz-q .term-highlight{ color:var(--primary); }
  .quiz-options{ display:flex; flex-direction:column; gap:10px; }
  .quiz-opt{
    background:var(--surface);
    border:2px solid var(--line);
    border-radius:12px;
    padding:14px 16px;
    font-weight:600;
    text-align:left;
    cursor:pointer;
    font-family:'Inter';
    font-size:0.95rem;
  }
  .quiz-opt:hover{ border-color:var(--primary); }
  .quiz-opt.correct{ border-color:var(--success); background:var(--success-tint); color:var(--success); }
  .quiz-opt.incorrect{ border-color:var(--danger); background:var(--danger-tint); color:var(--danger); }
  .quiz-opt:disabled{ cursor:default; }
  .quiz-opt:disabled:hover{ border-color:var(--line); }
  .quiz-opt.correct:disabled:hover{ border-color:var(--success); }
  .quiz-opt.incorrect:disabled:hover{ border-color:var(--danger); }

  /* ---------- RESULT ---------- */
  .result-wrap{ text-align:center; padding:20px 0; }
  .result-score{
    font-family:'Sora'; font-weight:800;
    font-size:3.2rem;
    margin:10px 0;
  }
  .result-score.pass{ color:var(--success); }
  .result-score.fail{ color:var(--danger); }
  .result-msg{ color:var(--ink-soft); margin-bottom:26px; }

  .footer-actions{ margin-top:30px; text-align:center; }
  .footer-actions button{ font-size:0.82rem; color:var(--ink-soft); background:none; border:none; cursor:pointer; text-decoration:underline; }

  .loading{ text-align:center; padding:80px 20px; color:var(--ink-soft); }

  /* ---------- DISCUSSION / CHAT ---------- */
  .discussion-hero{ max-width:420px; margin:20px auto 0; }
  .searching-spinner{
    width:44px;height:44px;
    border-radius:50%;
    border:4px solid var(--surface-2);
    border-top-color:var(--accent);
    margin:10px auto 0;
    animation: spin 0.9s linear infinite;
  }
  @keyframes spin{ to{ transform:rotate(360deg); } }
  .chat-header{
    display:flex; align-items:center; justify-content:space-between;
    padding:14px 16px;
    background:var(--surface);
    border:1px solid var(--line);
    border-radius:14px 14px 0 0;
  }
  .chat-window{
    height:min(52vh, 420px);
    overflow-y:auto;
    background:var(--bg);
    border-left:1px solid var(--line);
    border-right:1px solid var(--line);
    padding:16px;
    display:flex;
    flex-direction:column;
    gap:8px;
  }
  .chat-bubble-row{ display:flex; justify-content:flex-start; }
  .chat-bubble-row.mine{ justify-content:flex-end; }
  .chat-bubble{
    max-width:75%;
    padding:10px 14px;
    border-radius:16px 16px 16px 4px;
    background:var(--surface);
    border:1px solid var(--line);
    font-size:0.92rem;
    word-break:break-word;
  }
  .chat-bubble.mine{
    background:var(--primary);
    color:#fff;
    border-color:var(--primary);
    border-radius:16px 16px 4px 16px;
  }
  .chat-input-row{
    display:flex; gap:10px;
    padding:14px 16px;
    background:var(--surface);
    border:1px solid var(--line);
    border-radius:0 0 14px 14px;
  }

  /* ---------- ADMIN / PROFILE ---------- */
  .admin-pill{
    font-size:0.62rem;
    font-weight:800;
    letter-spacing:0.06em;
    background:var(--primary);
    color:#fff;
    padding:3px 8px;
    border-radius:999px;
    vertical-align:middle;
  }
  .profile-panel{
    margin-top:-4px;
  }
  .profile-row{
    font-size:0.9rem;
    margin-bottom:4px;
  }
  .profile-label{
    color:var(--ink-soft);
    font-weight:600;
    margin-right:6px;
  }

  /* ---------- REGISTER ---------- */
  .register-wrap{
    max-width:420px;
    margin:40px auto 0;
    padding:0 4px;
  }
  .register-avatar{
    display:block;
    width:96px;height:96px;
    border-radius:50%;
    object-fit:cover;
    object-position:center 30%;
    margin:0 auto 18px;
    border:3px solid var(--surface);
    box-shadow:0 0 0 3px var(--accent);
  }

  /* ---------- MASCOT ---------- */
  .mascot-wrap{
    position:fixed;
    bottom:20px;
    right:20px;
    z-index:50;
    display:flex;
    flex-direction:column;
    align-items:flex-end;
    gap:8px;
  }
  .mascot-bubble{
    background:var(--surface);
    border:1px solid var(--line);
    border-radius:14px;
    padding:10px 14px;
    font-size:0.85rem;
    font-weight:600;
    color:var(--primary-deep);
    box-shadow:var(--shadow);
    max-width:200px;
    text-align:center;
    opacity:0;
    transform:translateY(6px) scale(0.95);
    transition: opacity .25s ease, transform .25s ease;
    pointer-events:none;
  }
  .mascot-bubble.show{
    opacity:1;
    transform:translateY(0) scale(1);
  }
  .mascot-btn{
    background:none;
    border:none;
    cursor:pointer;
    padding:0;
    width:64px;height:64px;
    filter:drop-shadow(0 8px 16px rgba(140,53,87,0.28));
    animation: mascotBob 3.2s ease-in-out infinite;
    transition: transform .2s ease;
  }
  .mascot-btn:hover{ transform: scale(1.08); }
  .mascot-btn:active{ transform: scale(0.94); }
  @keyframes mascotBob{
    0%,100%{ transform: translateY(0) rotate(-2deg); }
    50%{ transform: translateY(-8px) rotate(2deg); }
  }
  @keyframes mascotHappyBounce{
    0%{ transform: scale(1) rotate(0deg); }
    30%{ transform: scale(1.28) rotate(-10deg); }
    60%{ transform: scale(1.14) rotate(8deg); }
    100%{ transform: scale(1) rotate(0deg); }
  }
  @keyframes mascotSadShake{
    0%,100%{ transform: translateX(0) rotate(0deg); }
    20%{ transform: translateX(-5px) rotate(-5deg); }
    40%{ transform: translateX(5px) rotate(5deg); }
    60%{ transform: translateX(-4px) rotate(-3deg); }
    80%{ transform: translateX(4px) rotate(3deg); }
  }
  @media (prefers-reduced-motion: reduce){
    .mascot-btn{ animation:none; }
  }
  @media (max-width:480px){
    .mascot-wrap{ bottom:14px; right:14px; }
    .mascot-btn{ width:52px; height:52px; }
  }

  @media (max-width:480px){
    .flashcard{ height:210px; }
    .match-grid{ gap:12px; }
  }
</style>

function buildSeedGroups(){
  return SEED_GROUPS.map(g => ({
    id: uid(),
    name: g.name,
    words: g.words.map(([term, translation, definition]) => ({ id: uid(), term, translation, definition: definition||'' }))
  }));
}

function uid(){ return Math.random().toString(36).slice(2,10); }
function shuffle(arr){
  const a = arr.slice();
  for(let i=a.length-1;i>0;i--){
    const j = Math.floor(Math.random()*(i+1));
    [a[i],a[j]]=[a[j],a[i]];
  }
  return a;
}
function escapeHtml(s){
  return String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}

/* ================= PERSISTENCE (browser localStorage — works on any hosting) ================= */
async function loadData(){
  try{
    const raw = localStorage.getItem(STORAGE_KEY);
    if(raw){
      const parsed = JSON.parse(raw);
      state.groups = parsed.groups || [];
      state.results = parsed.results || {};
      state.checkpoints = parsed.checkpoints || {};
      state.wrongWords = parsed.wrongWords || [];
    }
  }catch(e){
    // no saved data yet — start fresh
  }
  if(state.groups.length === 0){
    state.groups = buildSeedGroups();
    await saveData();
  }
  loadProfile();
  if(!state.profile){ state.view = 'register'; }
  else { trySyncProfileToFirebase(); }
  render();
}
function trySyncProfileToFirebase(attempts){
  attempts = attempts || 0;
  if(window.__firebaseSaveProfile && state.profile){
    window.__firebaseSaveProfile(state.profile);
  } else if(attempts < 25){
    setTimeout(()=>trySyncProfileToFirebase(attempts+1), 300);
  }
}
function getDeviceId(){
  let id = localStorage.getItem('vocab-device-id');
  if(!id){
    id = uid()+uid();
    localStorage.setItem('vocab-device-id', id);
  }
  return id;
}
function loadProfile(){
  try{
    const raw = localStorage.getItem(PROFILE_KEY);
    if(raw) state.profile = JSON.parse(raw);
  }catch(e){}
}
function saveProfileData(){
  try{
    localStorage.setItem(PROFILE_KEY, JSON.stringify(state.profile));
  }catch(e){
    console.error('Profilni saqlashda xatolik', e);
  }
  // Firebase moduli (script type="module") sahifa birinchi marta ochilganda
  // hali to'liq yuklanmagan bo'lishi mumkin — shu sabab bir martalik urinish
  // ba'zan yo'qolib ketardi va foydalanuvchi admin panelida ko'rinmas edi.
  // Shu uchun tayyor bo'lguncha qayta-qayta urinamiz.
  trySyncProfileToFirebase();
}
async function saveData(){
  try{
    localStorage.setItem(STORAGE_KEY, JSON.stringify({
      groups: state.groups,
      results: state.results,
      checkpoints: state.checkpoints,
      wrongWords: state.wrongWords
    }));
  }catch(e){
    console.error('Saqlashda xatolik', e);
  }
  syncScoreToFirebase();
}
function syncScoreToFirebase(){
  if(!state.profile) return;
  state.profile.score = totalWordsInPassedGroups();
  saveProfileData();
}

/* ================= DOMAIN LOGIC ================= */
function isGroupPassed(groupId){
  return !!(state.results[groupId] && state.results[groupId].passed);
}
function isCheckpointPassed(cpIndex){
  return !!(state.checkpoints[cpIndex] && state.checkpoints[cpIndex].passed);
}
function isCheckpointUnlocked(cpIndex){
  const startIdx = (cpIndex-1)*3;
  const endIdx = cpIndex*3 - 1;
  if(endIdx >= state.groups.length) return false;
  for(let k=startIdx;k<=endIdx;k++){
    if(!isGroupPassed(state.groups[k].id)) return false;
  }
  return true;
}
function isGroupUnlocked(i){
  if(i===0) return true;
  if(!isGroupPassed(state.groups[i-1].id)) return false;
  if(i % 3 === 0){
    const cpIndex = i/3;
    return isCheckpointPassed(cpIndex);
  }
  return true;
}
function totalCheckpoints(){
  return Math.floor(state.groups.length/3);
}

/* ================= ACTIONS: GROUPS/WORDS ================= */
function addGroup(name){
  name = name.trim();
  if(!name) return;
  state.groups.push({ id: uid(), name, words: [] });
  saveData();
  render();
}
function deleteGroup(groupId){
  if(!confirm('Bu guruhni butunlay o\'chirasizmi? Barcha so\'zlar va progress yo\'qoladi.')) return;
  state.groups = state.groups.filter(g=>g.id!==groupId);
  delete state.results[groupId];
  saveData();
  goHome();
}
function addWord(groupId, term, definition, translation){
  term = term.trim(); definition = (definition||'').trim(); translation = translation.trim();
  if(!term || !translation) return;
  const g = state.groups.find(g=>g.id===groupId);
  g.words.push({ id: uid(), term, definition, translation });
  saveData();
  render();
}
function speakWord(term){
  if(!('speechSynthesis' in window)) return;
  window.speechSynthesis.cancel();
  const u = new SpeechSynthesisUtterance(term);
  u.lang = 'en-US';
  u.rate = 0.9;
  window.speechSynthesis.speak(u);
}
function deleteWord(groupId, wordId){
  const g = state.groups.find(g=>g.id===groupId);
  g.words = g.words.filter(w=>w.id!==wordId);
  saveData();
  render();
}

function submitRegister(){
  const name = document.getElementById('regName').value.trim();
  const age = document.getElementById('regAge').value.trim();
  const nick = document.getElementById('regNick').value.trim();
  if(!name || !nick){
    alert("Iltimos, kamida Ism va Nickname kiriting.");
    return;
  }
  state.profile = {
    name, age, nickname: nick,
    deviceId: (state.profile && state.profile.deviceId) || getDeviceId(),
    updatedAt: Date.now()
  };
  saveProfileData();
  state.editingProfile = false;
  state.showProfile = false;
  state.view = 'home';
  render();
}

}

  state.editingProfile = false;
  state.view = 'home';

function loadAdminFlag(){
  try{ state.isAdmin = localStorage.getItem(ADMIN_FLAG_KEY) === '1'; }catch(e){ state.isAdmin = false; }
}
function requireAdmin(){
  if(state.isAdmin) return true;
  const entered = prompt("🔒 Admin PIN kodini kiriting:");
  if(entered === null) return false;
  if(entered.trim() !== ADMIN_PIN){
    alert("Noto'g'ri PIN kod.");
    return false;
  }
  state.isAdmin = true;
  try{ localStorage.setItem(ADMIN_FLAG_KEY, '1'); }catch(e){}
  return true;
}
function unlockAdminAndRender(){
  if(requireAdmin()) render();
}
async function openAdminPanel(){
  if(!requireAdmin()) return;
  state.view = 'adminUsers';
  state.showProfile = false;
  state.adminUsersLoading = true;
  state.adminUsersList = [];
  render();
  let attempts = 0;
  while(!window.__firebaseLoadAllUsers && attempts < 20){
    await new Promise(r=>setTimeout(r, 250));
    attempts++;
  }
  if(window.__firebaseLoadAllUsers){
    try{
      state.adminUsersList = await window.__firebaseLoadAllUsers();
    }catch(e){
      console.error('Foydalanuvchilarni yuklashda xatolik', e);
    }
  }
  state.adminUsersLoading = false;
  render();
}

/* ================= FLASHCARDS ================= */
function startFlashcards(groupId){
  const g = state.groups.find(g=>g.id===groupId);
  if(!g || g.words.length===0) return;
  state.flash = { groupId, order: shuffle(g.words.map(w=>w.id)), index:0, flipped:false };
  state.view = 'flashcards';
  render();
}
function flashFlip(){ state.flash.flipped = !state.flash.flipped; render(); }
function flashNext(){
  const f = state.flash;
  if(f.index < f.order.length-1){ f.index++; f.flipped=false; render(); }
}
function flashPrev(){
  const f = state.flash;
  if(f.index > 0){ f.index--; f.flipped=false; render(); }
}
function flashShuffle(){
  const f = state.flash;
  f.order = shuffle(f.order);
  f.index = 0; f.flipped=false;
  render();
}

/* ================= MATCH GAME ================= */
function startMatch(groupId){
  const g = state.groups.find(g=>g.id===groupId);
  if(!g || g.words.length < 4) return;
  const pool = shuffle(g.words).slice(0, Math.min(8, g.words.length));
  state.match = {
    groupId,
    words: pool,
    termOrder: shuffle(pool.map(w=>w.id)),
    transOrder: shuffle(pool.map(w=>w.id)),
    solved: new Set(),
    selectedTerm: null,
    selectedTrans: null,
    wrongFlash: null
  };
  state.view = 'match';
  render();
}
function matchPickTerm(wordId){
  const m = state.match;
  if(m.solved.has(wordId)) return;
  m.selectedTerm = wordId;
  if(m.selectedTrans) matchCheck();
  else render();
}
function matchPickTrans(wordId){
  const m = state.match;
  if(m.solved.has(wordId)) return;
  m.selectedTrans = wordId;
  if(m.selectedTerm) matchCheck();
  else render();
}
function matchCheck(){
  const m = state.match;
  if(m.selectedTerm === m.selectedTrans){
    m.solved.add(m.selectedTerm);
    m.selectedTerm = null; m.selectedTrans = null;
    mascotReact(true);
    render();
  } else {
    m.wrongFlash = { term:m.selectedTerm, trans:m.selectedTrans };
    mascotReact(false);
    render();
    setTimeout(()=>{
      m.wrongFlash = null;
      m.selectedTerm = null; m.selectedTrans = null;
      render();
    }, 500);
  }
}

/* ================= QUIZ ================= */
function buildQuestions(words, cap){
  let pool = shuffle(words);
  if(cap) pool = pool.slice(0, cap);
  const allTrans = [...new Set(words.map(w=>w.translation))];
  return pool.map(w=>{
    const distractors = shuffle(allTrans.filter(t=>t!==w.translation)).slice(0,3);
    const options = shuffle([w.translation, ...distractors]);
    return { term:w.term, correct:w.translation, options };
  });
}
function startQuiz(groupId){
  const g = state.groups.find(g=>g.id===groupId);
  if(!g || g.words.length < 4) return;
  state.quiz = {
    mode:'group',
    groupId,
    questions: buildQuestions(g.words, null),
    index:0, correct:0, selected:null, answered:false
  };
  state.view = 'quiz';
  render();
}
function startCheckpointQuiz(cpIndex){
  const groups = state.groups.slice((cpIndex-1)*3, cpIndex*3);
  const words = groups.flatMap(g=>g.words);
  if(words.length < 4) return;
  state.quiz = {
    mode:'checkpoint',
    cpIndex,
    questions: buildQuestions(words, 24),
    index:0, correct:0, selected:null, answered:false
  };
  state.view = 'quiz';
  render();
}
function quizAnswer(opt){
  const q = state.quiz;
  if(q.answered) return;
  q.answered = true;
  q.selected = opt;
  const question = q.questions[q.index];
  const isCorrect = opt === question.correct;
  if(isCorrect){
    q.correct++;
    incrementGoalProgress();
  } else {
    addWrongWord(question.term, question.correct);
  }
  mascotReact(isCorrect);
  render();
}
function addWrongWord(term, translation){
  const exists = state.wrongWords.find(w=>w.term===term);
  if(!exists){
    state.wrongWords.push({ term, translation });
  }
  saveData();
}
function removeWrongWord(term){
  state.wrongWords = state.wrongWords.filter(w=>w.term!==term);
  saveData();
  render();
}
function quizNext(){
  const q = state.quiz;
  if(q.index < q.questions.length-1){
    q.index++; q.answered=false; q.selected=null;
    render();
  } else {
    finishQuiz();
  }
}
function finishQuiz(){
  const q = state.quiz;
  const total = q.questions.length;
  const ratio = q.correct/total;
  const passed = ratio >= 0.95 - 1e-9;
  const pct = Math.round(ratio*100);

  if(q.mode === 'group'){
    const prev = state.results[q.groupId];
    state.results[q.groupId] = { passed: passed || (prev&&prev.passed), bestScore: Math.max(pct, prev?prev.bestScore:0) };
  } else {
    const prev = state.checkpoints[q.cpIndex];
    state.checkpoints[q.cpIndex] = { passed: passed || (prev&&prev.passed), bestScore: Math.max(pct, prev?prev.bestScore:0) };
  }
  saveData();
  state.view = 'quizResult';
  state.quiz.finalPct = pct;
  state.quiz.finalPassed = passed || (q.mode==='group' ? isGroupPassed(q.groupId) : isCheckpointPassed(q.cpIndex));
  render();
}
function retryQuiz(){
  if(state.quiz.mode==='group') startQuiz(state.quiz.groupId);
  else startCheckpointQuiz(state.quiz.cpIndex);
}

function totalWordsInPassedGroups(){
  return state.groups.filter(g=>isGroupPassed(g.id)).reduce((sum,g)=>sum+g.words.length,0);
}
function hasAnyPerfectScore(){
  const groupPerfect = Object.values(state.results||{}).some(r=>r && r.bestScore===100);
  const cpPerfect = Object.values(state.checkpoints||{}).some(r=>r && r.bestScore===100);
  return groupPerfect || cpPerfect;
}
function computeBadges(){
  const passedCount = state.groups.filter(g=>isGroupPassed(g.id)).length;
  const wordsLearned = totalWordsInPassedGroups();
  const streak = state.streak ? state.streak.count : 0;
  return [
    { glyph:'🌱', name:"Birinchi 3 guruh", earned: passedCount >= 3 },
    { glyph:'💯', name:"100% natija bilan test", earned: hasAnyPerfectScore() },
    { glyph:'📚', name:"50 ta so'z yodlandi", earned: wordsLearned >= 50 },
    { glyph:'🔥', name:"7 kunlik streak", earned: streak >= 7 },
    { glyph:'🏆', name:"Barcha guruhlar tugatildi", earned: state.groups.length>0 && passedCount === state.groups.length },
  ];
}
function renderBadges(){
  const badges = computeBadges();
  const streak = state.streak ? state.streak.count : 0;

/* ================= STREAK ================= */
const STREAK_KEY = 'vocab-streak-v1';
function loadStreak(){
  try{
    const raw = localStorage.getItem(STREAK_KEY);
    if(raw){ state.streak = JSON.parse(raw); }
  }catch(e){}
  if(!state.streak) state.streak = { count:0, lastDate:null };
  updateStreakForToday();
}
function updateStreakForToday(){
  const today = new Date().toISOString().slice(0,10);
  const last = state.streak.lastDate;
  if(last === today) return; // already counted today
  if(last){
    const lastDate = new Date(last);
    const diffDays = Math.round((new Date(today) - lastDate) / 86400000);
    state.streak.count = (diffDays === 1) ? state.streak.count + 1 : 1;
  } else {
    state.streak.count = 1;
  }
  state.streak.lastDate = today;
  try{ localStorage.setItem(STREAK_KEY, JSON.stringify(state.streak)); }catch(e){}
}

/* ================= DAILY GOAL ================= */
const GOAL_KEY = 'vocab-goal-v1';
function loadDailyGoal(){
  const today = new Date().toISOString().slice(0,10);
  let goal = null;
  try{
    const raw = localStorage.getItem(GOAL_KEY);
    if(raw) goal = JSON.parse(raw);
  }catch(e){}
  if(!goal || goal.date !== today){
    goal = { date: today, count: 0, target: (goal && goal.target) || 10 };
  }
  state.dailyGoal = goal;
  saveDailyGoal();
}
function saveDailyGoal(){
  try{ localStorage.setItem(GOAL_KEY, JSON.stringify(state.dailyGoal)); }catch(e){}
}
function incrementGoalProgress(){
  if(!state.dailyGoal) loadDailyGoal();
  state.dailyGoal.count++;
  saveDailyGoal();
}
function setDailyGoalTarget(newTarget){
  newTarget = parseInt(newTarget,10);
  if(!newTarget || newTarget < 1) return;
  state.dailyGoal.target = newTarget;
  saveDailyGoal();
  render();
}

        </div>
      </div>`;
  } else {
    html += `
      <div class="card admin-gate">
        <div class="gc-meta">Yangi guruh qo'shish faqat administrator uchun</div>
        <button class="btn btn-ghost btn-sm" onclick="unlockAdminAndRender()">🔑 Admin sifatida kirish</button>
      </div>`;
  }

  if(state.groups.length===0){
    html += `
      <div class="empty-state">
        <h3>Hali guruh yo'q</h3>
        <p>Birinchi so'z guruhingizni yarating va so'zlarni qo'sha boshlang.</p>

  html += `<div class="section-title">Guruhlar</div>`;
  html += `<div class="groups-grid">`;
  state.groups.forEach((g,i)=>{
    html += `
      <div class="group-card" onclick="openLearnGroup('${g.id}')">

          <div class="gc-name">${i+1}. ${escapeHtml(g.name)}</div>

function renderQuizList(){
  let html = `<button class="back-link" onclick="goHome()">← Bosh sahifaga</button>`;
  html += `<h2 style="margin-bottom:16px;">📝 Quiz</h2>`;
  html += renderPathTrack();

  if(state.groups.length===0){
    html += `
      <div class="empty-state">
        <h3>Hali guruh yo'q</h3>
        <p>Avval "O'rganish" bo'limida guruh va so'zlar qo'shing.</p>
      </div>`;
    return html;
  }

  html += `<div class="section-title">Testlar</div>`;
  html += `<div class="groups-grid">`;
  state.groups.forEach((g,i)=>{
    const unlocked = isGroupUnlocked(i);
    const passed = isGroupPassed(g.id);
    const best = state.results[g.id]?.bestScore;
    let badge = unlocked ? `<span class="badge badge-open">Ochiq</span>` : `<span class="badge badge-locked">🔒 Yopiq</span>`;
    if(passed) badge = `<span class="badge badge-done">✓ ${best}%</span>`;

    html += `
      <div class="group-card ${unlocked?'':'locked'}" onclick="${unlocked?`openQuizGroup('${g.id}')`:''}">
        <div class="gc-top">
          <div class="gc-name">${i+1}. ${escapeHtml(g.name)}</div>
          ${badge}
        </div>
        <div class="gc-meta">${g.words.length} ta so'z${!unlocked?' · avvalgi guruhni 95% bilan tugating':''}</div>
      </div>`;

    if((i+1)%3===0){
      const cpIndex=(i+1)/3;
      const cpUnlocked = isCheckpointUnlocked(cpIndex);
      const cpPassed = isCheckpointPassed(cpIndex);
      const cpBest = state.checkpoints[cpIndex]?.bestScore;
      let cpBadge = cpUnlocked ? `<span class="badge badge-open">Ochiq</span>` : `<span class="badge badge-locked">🔒 Yopiq</span>`;
      if(cpPassed) cpBadge = `<span class="badge badge-done">✓ ${cpBest}%</span>`;
      html += `
        <div class="group-card checkpoint-card ${cpUnlocked?'':'locked'}" onclick="${cpUnlocked?`startCheckpointQuiz(${cpIndex})`:''}">
          <div class="gc-top">
            <div class="gc-name">🎯 Nazorat testi — ${(cpIndex-1)*3+1}–${cpIndex*3} guruhlar</div>
            ${cpBadge}
          </div>
          <div class="gc-meta">3 guruh bo'yicha umumiy test${!cpUnlocked?' · avval shu 3 guruhni tugating':''}</div>
        </div>`;
    }
  });
  html += `</div>`;
  return html;
}

function editWordDefinition(groupId, wordId){
  if(!requireAdmin()) return;
  const g = state.groups.find(g=>g.id===groupId);
  const w = g && g.words.find(w=>w.id===wordId);
  if(!w) return;
  const newDef = prompt("Definitsiya (ingliz tilida):", w.definition||'');
  if(newDef===null) return;
  w.definition = newDef.trim();
  saveData();
  render();
}

/* ---------- MATCH VIEW ---------- */
function renderMatch(){
  const m = state.match;
  const g = state.groups.find(g=>g.id===m.groupId);
  const byId = id => m.words.find(w=>w.id===id);
  const allSolved = m.solved.size === m.words.length;

  function itemClass(id, isTermSide){
    let cls = 'match-item';
    if(m.solved.has(id)) cls += ' solved';
    if(m.wrongFlash && ((isTermSide && m.wrongFlash.term===id) || (!isTermSide && m.wrongFlash.trans===id))) cls += ' wrong';
    else if((isTermSide && m.selectedTerm===id) || (!isTermSide && m.selectedTrans===id)) cls += ' selected';
    return cls;
  }

  let html = `
    <button class="back-link" onclick="openLearnGroup('${g.id}')">← ${escapeHtml(g.name)}</button>
    <h2 style="margin-bottom:4px;">🔗 Moslashtirish o'yini</h2>
    <div class="gc-meta">So'z va tarjimasini juftlashtiring</div>
    <div class="match-grid">
      <div class="match-col">`;
  m.termOrder.forEach(id=>{
    const w = byId(id);
    html += `<div class="${itemClass(id,true)}" onclick="matchPickTerm('${id}')">${escapeHtml(w.term)}</div>`;
  });
  html += `</div><div class="match-col">`;
  m.transOrder.forEach(id=>{
    const w = byId(id);
    html += `<div class="${itemClass(id,false)}" onclick="matchPickTrans('${id}')">${escapeHtml(w.translation)}</div>`;
  });
  html += `</div></div>`;

  if(allSolved){
    html += `
      <div class="match-status">🎉 Barchasi topildi!</div>
      <div class="flash-controls" style="justify-content:center;">
        <button class="btn btn-ghost" onclick="startMatch('${g.id}')">🔀 Qayta o'ynash</button>
        <button class="btn btn-primary" onclick="openLearnGroup('${g.id}')">Guruhga qaytish</button>
      </div>`;
  } else {
    html += `<div class="match-status">${m.solved.size} / ${m.words.length} topildi</div>`;
  }
  return html;
}

/* ---------- QUIZ VIEW ---------- */
function renderQuiz(){
  const q = state.quiz;
  const cur = q.questions[q.index];
  const title = q.mode==='group'
    ? state.groups.find(g=>g.id===q.groupId).name
    : `Nazorat testi ${q.cpIndex}`;

  let optsHtml = '';
  cur.options.forEach(opt=>{
    let cls = 'quiz-opt';
    if(q.answered){
      if(opt===cur.correct) cls += ' correct';
      else if(opt===q.selected) cls += ' incorrect';
    }
    optsHtml += `<button class="${cls}" ${q.answered?'disabled':''} onclick="quizAnswer('${opt.replace(/'/g,"\\'")}')">${escapeHtml(opt)}</button>`;
  });

  return `
    <div class="gc-meta" style="margin-bottom:4px;">📝 ${escapeHtml(title)}</div>
    <div class="quiz-progress-bar"><div class="quiz-progress-fill" style="width:${(q.index/q.questions.length)*100}%"></div></div>
    <div class="quiz-q">"<span class="term-highlight">${escapeHtml(cur.term)}</span>" so'zining tarjimasi qaysi?</div>
    <div class="quiz-options">${optsHtml}</div>
    ${q.answered?`<div style="margin-top:22px;text-align:center;"><button class="btn btn-primary" onclick="quizNext()">${q.index<q.questions.length-1?'Keyingi savol →':"Natijani ko'rish"}</button></div>`:''}
  `;
}

/* ---------- QUIZ RESULT VIEW ---------- */
function renderQuizResult(){
  const q = state.quiz;
  const pct = q.finalPct;
  const passed = pct/100 >= 0.95 - 1e-9;
  let msg;
  if(passed){
    msg = q.mode==='group'
      ? "Ajoyib! Keyingi guruh ochildi."
      : "Zo'r! Nazorat testi muvaffaqiyatli topshirildi.";
  } else {
    msg = `95% kerak edi, siz ${pct}% to'pladingiz. Yana urinib ko'ring!`;
  }

  return `
    <div class="card result-wrap">
      <div style="font-size:2.2rem;">${passed?'🎉':'💪'}</div>
      <div class="result-score ${passed?'pass':'fail'}">${pct}%</div>
      <div class="result-msg">${msg}</div>
      <div class="row" style="justify-content:center;">
        <button class="btn btn-ghost" onclick="retryQuiz()">🔁 Qayta urinish</button>
        <button class="btn btn-primary" onclick="${q.mode==='group'?`openQuizGroup('${q.groupId}')`:'openQuizList()'}">${q.mode==='group'?"Guruhga qaytish":"Testlarga qaytish"}</button>
      </div>
    </div>`;
}

  bubble.textContent = text;
  bubble.classList.add('show');
  if(bounce===true) btn.style.animation = 'mascotHappyBounce .6s ease';
  else if(bounce===false) btn.style.animation = 'mascotSadShake .5s ease';
  clearTimeout(mascotTimer);
  mascotTimer = setTimeout(()=>{

<script type="module">
  import { initializeApp } from "https://www.gstatic.com/firebasejs/12.17.1/firebase-app.js";
  import {
    getFirestore, doc, setDoc, deleteDoc, collection, getDocs,
    addDoc, onSnapshot, query, orderBy, where
  } from "https://www.gstatic.com/firebasejs/12.17.1/firebase-firestore.js";

  const firebaseConfig = {
    apiKey: "AIzaSyDWfpwkR5vKGHeK9YhNX60h4JVkEFuOmZI",
    authDomain: "learn-with-theodore.firebaseapp.com",
    projectId: "learn-with-theodore",
    storageBucket: "learn-with-theodore.firebasestorage.app",
    messagingSenderId: "179195011460",
    appId: "1:179195011460:web:9d5a6456bc51011fc63dd1",
    measurementId: "G-VCQTQ83T1P"
  };

  const app = initializeApp(firebaseConfig);
  const db = getFirestore(app);

  window.__firebaseSaveProfile = async function(profile){
    try{
      if(!profile || !profile.deviceId) return;
      await setDoc(doc(db, 'users', profile.deviceId), profile, { merge: true });
    }catch(e){
      console.error('Firebase saqlashda xatolik:', e);
    }
  };

  window.__firebaseLoadAllUsers = async function(){
    try{
      const snap = await getDocs(collection(db, 'users'));
      return snap.docs.map(d => ({ id: d.id, ...d.data() }));
    }catch(e){
      console.error('Firebase yuklashda xatolik:', e);
      return [];
    }
  };

  /* ---------- MATCHMAKING / RANDOM CHAT ---------- */
  let matchUnsubA = null, matchUnsubB = null;

  async function tryCreateChatFromQueue(deviceId, nickname, onMatched){
    const snap = await getDocs(collection(db, 'queue'));
    const candidates = snap.docs.filter(d => d.id !== deviceId);
    if(candidates.length === 0) return false;
    candidates.sort((a,b) => (a.data().createdAt||0) - (b.data().createdAt||0));
    const partner = candidates[0];

    const chatRef = await addDoc(collection(db, 'chats'), {
      userA: partner.id,
      userB: deviceId,
      userAName: partner.data().nickname || 'Foydalanuvchi',
      userBName: nickname,
      createdAt: Date.now()
    });
    try{ await deleteDoc(doc(db, 'queue', partner.id)); }catch(e){}
    try{ await deleteDoc(doc(db, 'queue', deviceId)); }catch(e){}

    onMatched({ chatId: chatRef.id, partnerName: partner.data().nickname || 'Foydalanuvchi' });
    return true;
  }

  window.__firebaseStartMatchmaking = async function(deviceId, nickname, onMatched){
    try{
      const matched = await tryCreateChatFromQueue(deviceId, nickname, onMatched);
      if(matched) return;

      // no one waiting — add self to queue and listen for a chat being created for us
      await setDoc(doc(db, 'queue', deviceId), { nickname, createdAt: Date.now() });

      const handle = (snap) => {
        if(snap.empty) return;
        const d = snap.docs[0];
        const data = d.data();
        const partnerName = data.userA === deviceId ? data.userBName : data.userAName;
        if(matchUnsubA) { matchUnsubA(); matchUnsubA = null; }
        if(matchUnsubB) { matchUnsubB(); matchUnsubB = null; }
        deleteDoc(doc(db, 'queue', deviceId)).catch(()=>{});
        onMatched({ chatId: d.id, partnerName });
      };

      matchUnsubA = onSnapshot(query(collection(db,'chats'), where('userA','==',deviceId)), handle);
      matchUnsubB = onSnapshot(query(collection(db,'chats'), where('userB','==',deviceId)), handle);
    }catch(e){
      console.error('Matchmaking xatolik:', e);
    }
  };

  window.__firebaseCancelSearch = async function(deviceId){
    try{
      if(matchUnsubA) { matchUnsubA(); matchUnsubA = null; }
      if(matchUnsubB) { matchUnsubB(); matchUnsubB = null; }
      await deleteDoc(doc(db, 'queue', deviceId));
    }catch(e){}
  };

  window.__firebaseSendMessage = async function(chatId, deviceId, nickname, text){
    try{
      await addDoc(collection(db, 'chats', chatId, 'messages'), {
        sender: deviceId,
        senderName: nickname,
        text,
        createdAt: Date.now()
      });
    }catch(e){
      console.error('Xabar yuborishda xatolik:', e);
    }
  };

  window.__firebaseListenMessages = function(chatId, callback){
    const q = query(collection(db, 'chats', chatId, 'messages'), orderBy('createdAt', 'asc'));
    return onSnapshot(q, (snap) => {
      callback(snap.docs.map(d => d.data()));
    });
  };
</script>
