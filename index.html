<!doctype html>
<html lang="uz">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>NOL ACADEMY — O'quv markazi</title>
<meta name="description" content="O'quv markazining rasmiy sayti: o'quvchilar, ota-onalar va o'qituvchilar uchun shaxsiy kabinet.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Playfair+Display:wght@600;700;800&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#0a0a0b;--panel:#141416;--panel2:#1b1b1f;--line:#2b2b30;
  --gold:#d4af37;--gold2:#f3d97e;--text:#f4f0e6;--mute:#9b968a;
  --ok:#4cc38a;--bad:#e5584f;--warn:#e8a93a;
  --r:16px;
}
*{box-sizing:border-box;margin:0;padding:0}
html{scroll-behavior:smooth}
body{background:var(--bg);color:var(--text);font-family:'Inter',system-ui,sans-serif;line-height:1.55;-webkit-font-smoothing:antialiased}
h1,h2,h3{font-family:'Playfair Display',Georgia,serif;font-weight:700;line-height:1.15}
a{color:inherit;text-decoration:none}
button{font:inherit;cursor:pointer;border:0;color:inherit;background:none}
input,select,textarea{font:inherit;color:var(--text);background:var(--panel2);border:1px solid var(--line);border-radius:10px;padding:10px 12px;width:100%;outline:none}
input:focus,select:focus,textarea:focus{border-color:var(--gold)}
label{display:block;font-size:13px;color:var(--mute);margin-bottom:5px}
.gold{color:var(--gold)}
.wrap{max-width:1140px;margin:0 auto;padding:0 20px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;padding:11px 22px;border-radius:999px;font-weight:600;transition:.2s}
.btn-gold{background:linear-gradient(135deg,var(--gold2),var(--gold));color:#1a1405}
.btn-gold:hover{transform:translateY(-1px);box-shadow:0 8px 24px rgba(212,175,55,.25)}
.btn-line{border:1px solid var(--gold);color:var(--gold)}
.btn-line:hover{background:rgba(212,175,55,.1)}
.btn-sm{padding:7px 14px;font-size:13px}
.btn-bad{border:1px solid var(--bad);color:var(--bad)}
/* nav */
.nav{position:sticky;top:0;z-index:20;background:rgba(10,10,11,.85);backdrop-filter:blur(12px);border-bottom:1px solid var(--line)}
.nav .wrap{display:flex;align-items:center;justify-content:space-between;height:68px;gap:16px}
.logo{display:flex;align-items:center;gap:10px;font-family:'Playfair Display',serif;font-size:21px;font-weight:700}
.logo i{width:36px;height:36px;border-radius:10px;background:linear-gradient(135deg,var(--gold2),var(--gold));display:grid;place-items:center;color:#1a1405;font-style:normal;font-weight:800}
.nav nav{display:flex;gap:26px;color:var(--mute);font-size:15px}
.nav nav a:hover{color:var(--gold)}
/* hero */
.hero{padding:96px 0 80px;background:radial-gradient(900px 400px at 80% -10%,rgba(212,175,55,.16),transparent),radial-gradient(600px 300px at 0% 100%,rgba(212,175,55,.07),transparent)}
.hero .wrap{display:grid;grid-template-columns:1.15fr .85fr;gap:48px;align-items:center}
.tag{display:inline-block;font-size:13px;letter-spacing:.14em;text-transform:uppercase;color:var(--gold);border:1px solid rgba(212,175,55,.4);padding:5px 14px;border-radius:999px;margin-bottom:22px}
.hero h1{font-size:clamp(36px,5.2vw,62px);margin-bottom:20px}
.hero p.lead{color:var(--mute);font-size:18px;max-width:520px;margin-bottom:30px}
.hero .cta{display:flex;gap:12px;flex-wrap:wrap}
.hero-card{background:linear-gradient(160deg,var(--panel2),var(--panel));border:1px solid var(--line);border-radius:24px;padding:26px;box-shadow:0 30px 80px rgba(0,0,0,.5)}
.hero-card h3{font-size:18px;margin-bottom:14px}
.mini{display:flex;justify-content:space-between;align-items:center;padding:11px 0;border-bottom:1px dashed var(--line);font-size:14px}
.mini:last-child{border:0}
.pill{display:inline-block;padding:3px 11px;border-radius:999px;font-size:12px;font-weight:600}
.p-ok{background:rgba(76,195,138,.15);color:var(--ok)}
.p-bad{background:rgba(229,88,79,.15);color:var(--bad)}
.p-warn{background:rgba(232,169,58,.15);color:var(--warn)}
.p-gold{background:rgba(212,175,55,.15);color:var(--gold)}
.stats{border-block:1px solid var(--line);background:var(--panel)}
.stats .wrap{display:grid;grid-template-columns:repeat(4,1fr);text-align:center;padding-block:30px}
.stats b{display:block;font-family:'Playfair Display',serif;font-size:36px;color:var(--gold)}
.stats span{color:var(--mute);font-size:14px}
section.block{padding:84px 0}
.sec-head{text-align:center;max-width:640px;margin:0 auto 46px}
.sec-head h2{font-size:clamp(28px,3.6vw,42px);margin-bottom:12px}
.sec-head p{color:var(--mute)}
.grid{display:grid;gap:20px}
.g3{grid-template-columns:repeat(3,1fr)}
.g4{grid-template-columns:repeat(4,1fr)}
.g2{grid-template-columns:repeat(2,1fr)}
.card{background:var(--panel);border:1px solid var(--line);border-radius:var(--r);padding:24px}
.card.hover{transition:.25s}
.card.hover:hover{border-color:var(--gold);transform:translateY(-3px)}
.ico{width:48px;height:48px;border-radius:14px;background:rgba(212,175,55,.12);display:grid;place-items:center;font-size:22px;margin-bottom:16px}
.card h3{font-size:20px;margin-bottom:8px}
.card p{color:var(--mute);font-size:15px}
.teacher{text-align:center}
.avatar{width:84px;height:84px;border-radius:50%;margin:0 auto 14px;background:linear-gradient(135deg,var(--gold2),#8a6d12);display:grid;place-items:center;font-family:'Playfair Display',serif;font-size:30px;color:#1a1405;font-weight:800}
.teacher small{color:var(--gold)}
.portal{background:var(--panel)}
.contact-box{display:grid;grid-template-columns:1fr 1fr;gap:20px}
footer{border-top:1px solid var(--line);padding:30px 0;color:var(--mute);font-size:14px;text-align:center}
/* login */
.login-page{min-height:calc(100vh - 68px);display:grid;place-items:center;padding:30px 16px;background:radial-gradient(700px 350px at 50% 0,rgba(212,175,55,.14),transparent)}
.login{width:100%;max-width:430px;background:var(--panel);border:1px solid var(--line);border-radius:22px;padding:34px}
.login h2{font-size:28px;margin-bottom:6px}
.login .sub{color:var(--mute);margin-bottom:22px;font-size:15px}
.field{margin-bottom:14px}
.demo-box{margin-top:22px;padding:14px;border:1px dashed rgba(212,175,55,.5);border-radius:12px;font-size:13px;color:var(--mute)}
.demo-box .row{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}
.err{color:var(--bad);font-size:14px;margin-bottom:12px;min-height:18px}
/* dashboard */
.dash-top{background:var(--panel);border-bottom:1px solid var(--line)}
.dash-top .wrap{display:flex;justify-content:space-between;align-items:center;padding-block:14px;gap:12px;flex-wrap:wrap}
.who{display:flex;align-items:center;gap:12px}
.who .avatar{width:42px;height:42px;font-size:17px;margin:0}
.who b{display:block;line-height:1.2}
.who small{color:var(--mute)}
.tabs{display:flex;gap:6px;overflow-x:auto;padding:14px 0 0}
.tab{padding:10px 18px;border-radius:10px 10px 0 0;color:var(--mute);font-weight:500;white-space:nowrap;border-bottom:2px solid transparent}
.tab:hover{color:var(--text)}
.tab.on{color:var(--gold);border-color:var(--gold)}
.main{padding:28px 0 70px}
.main h2{font-size:26px;margin-bottom:18px}
.kpis{display:grid;grid-template-columns:repeat(4,1fr);gap:16px;margin-bottom:22px}
.kpi{background:var(--panel);border:1px solid var(--line);border-radius:var(--r);padding:18px 20px}
.kpi small{color:var(--mute);font-size:13px}
.kpi b{display:block;font-family:'Playfair Display',serif;font-size:32px;margin-top:2px}
.kpi.bad b{color:var(--bad)}.kpi.ok b{color:var(--ok)}.kpi.gold b{color:var(--gold)}.kpi.warn b{color:var(--warn)}
table{width:100%;border-collapse:collapse;font-size:14px}
th{text-align:left;color:var(--mute);font-weight:500;font-size:12px;text-transform:uppercase;letter-spacing:.06em;padding:10px 12px;border-bottom:1px solid var(--line)}
td{padding:12px;border-bottom:1px solid var(--line);vertical-align:middle}
tr:last-child td{border-bottom:0}
.scroll{overflow-x:auto}
.empty{color:var(--mute);text-align:center;padding:28px;font-size:14px}
.bar{height:8px;border-radius:99px;background:var(--panel2);overflow:hidden;margin-top:6px}
.bar i{display:block;height:100%;border-radius:99px;background:linear-gradient(90deg,var(--gold),var(--gold2))}
.subj{margin-bottom:16px}
.subj .t{display:flex;justify-content:space-between;font-size:14px}
.form-row{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:12px;margin-bottom:12px;align-items:end}
.sel-row{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:18px;align-items:end}
.sel-row > div{min-width:200px}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:10px;overflow:hidden}
.seg button{padding:7px 13px;font-size:13px;color:var(--mute)}
.seg button.on-present{background:rgba(76,195,138,.2);color:var(--ok)}
.seg button.on-absent{background:rgba(229,88,79,.2);color:var(--bad)}
.seg button.on-late{background:rgba(232,169,58,.2);color:var(--warn)}
.chk{display:flex;gap:6px;flex-wrap:wrap}
.chk label{display:flex;align-items:center;gap:6px;margin:0;padding:6px 11px;border:1px solid var(--line);border-radius:999px;color:var(--text);cursor:pointer;font-size:13px}
.chk input{width:auto;accent-color:var(--gold)}
.news-item{padding:16px 0;border-bottom:1px solid var(--line)}
.news-item:last-child{border:0}
.news-item small{color:var(--mute)}
.news-item h3{font-size:18px;margin:3px 0 4px;font-family:'Inter',sans-serif;font-weight:600}
.week{display:grid;grid-template-columns:repeat(7,1fr);gap:10px}
.day{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:12px;min-height:130px}
.day.today{border-color:var(--gold)}
.day h4{font-size:13px;color:var(--gold);margin-bottom:8px;font-weight:600}
.lesson{background:var(--panel2);border-left:3px solid var(--gold);padding:7px 9px;border-radius:6px;font-size:12px;margin-bottom:7px}
.lesson b{display:block;font-size:13px}
.lesson span{color:var(--mute)}
.toast{position:fixed;bottom:24px;left:50%;transform:translateX(-50%);background:var(--gold);color:#1a1405;padding:12px 22px;border-radius:999px;font-weight:600;z-index:99;box-shadow:0 10px 30px rgba(0,0,0,.5)}
.toast.err{background:var(--bad);color:#fff}
.loading{padding:80px 0;text-align:center;color:var(--mute)}
.banner{background:rgba(212,175,55,.1);border-bottom:1px solid rgba(212,175,55,.35);color:var(--gold2);text-align:center;font-size:13px;padding:7px 12px}
@media(max-width:900px){
  .hero .wrap,.contact-box{grid-template-columns:1fr}
  .g3,.g4{grid-template-columns:1fr 1fr}
  .stats .wrap{grid-template-columns:1fr 1fr;gap:20px}
  .kpis{grid-template-columns:1fr 1fr}
  .nav nav{display:none}
  .week{grid-template-columns:1fr}
}
@media(max-width:560px){.g3,.g4,.g2{grid-template-columns:1fr}.hero{padding-top:60px}}
</style>

const KEY = "markaz_demo_v1";
let fbx = null;

function seed(){
  const pw = "123456";
  const users = [
    {id:"a1", role:"admin", name:"Administrator", email:"admin@demo.uz", password:pw, viewers:[]},
    {id:"t1", role:"teacher", name:"Dilnoza Karimova", email:"dilnoza@demo.uz", password:pw, subject:"Ingliz tili", viewers:[]},
    {id:"t2", role:"teacher", name:"Jasur Rahimov", email:"jasur@demo.uz", password:pw, subject:"Matematika", viewers:[]},
    {id:"s1", role:"student", name:"Aziza Yusupova", email:"aziza@demo.uz", password:pw, groupIds:["g1","g2"], viewers:["s1","p1"]},
    {id:"s2", role:"student", name:"Bekzod Olimov", email:"bekzod@demo.uz", password:pw, groupIds:["g1"], viewers:["s2","p2"]},
    {id:"s3", role:"student", name:"Madina Saidova", email:"madina@demo.uz", password:pw, groupIds:["g2"], viewers:["s3"]},
    {id:"p1", role:"parent", name:"Gulnora Yusupova", email:"gulnora@demo.uz", password:pw, childIds:["s1"], viewers:[]},
    {id:"p2", role:"parent", name:"Rustam Olimov", email:"rustam@demo.uz", password:pw, childIds:["s2"], viewers:[]}
  ];
  const groups = [
    {id:"g1", name:"English B1 — kechki guruh", subject:"Ingliz tili", teacherId:"t1", teacherName:"Dilnoza Karimova", days:[0,2,4], time:"17:00–18:30"},
    {id:"g2", name:"Matematika 9-sinf", subject:"Matematika", teacherId:"t2", teacherName:"Jasur Rahimov", days:[1,3], time:"16:00–17:30"}
  ];
  let n = 7; const rnd = () => (n = (n*9301 + 49297) % 233280) / 233280;
  const grades = [], attendance = [];
  for(let i=21;i>=1;i--){
    const d = new Date(); d.setDate(d.getDate()-i);
    const iso = d.toLocaleDateString("sv"), wd = (d.getDay()+6)%7;
    groups.forEach(g => {
      if(!g.days.includes(wd)) return;
      users.filter(u=>u.role==="student" && u.groupIds.includes(g.id)).forEach(s => {
        const r = rnd();
        const status = r < .78 ? "present" : r < .90 ? "absent" : "late";
        attendance.push({id:`${g.id}_${s.id}_${iso}`, studentId:s.id, groupId:g.id, subject:g.subject, date:iso, month:iso.slice(0,7), status, viewers:s.viewers});
        if(status !== "absent" && rnd() < .7)
          grades.push({id:uid(), studentId:s.id, groupId:g.id, subject:g.subject, topic:"Mavzu bo'yicha nazorat", value:Math.round(58 + rnd()*42), date:iso, month:iso.slice(0,7), teacherName:g.teacherName, viewers:s.viewers});
      });
    });
  }
  const homework = [
    {id:uid(), groupId:"g1", title:"Unit 7 — Past Perfect mashqlari", desc:"Darslikning 82–83-betlari, 1–6 mashqlar.", due:todayISO(), teacherName:"Dilnoza Karimova"},

    {id:uid(), title:"Ochiq dars kuni", text:"Shanba kuni soat 11:00 da ota-onalar uchun ochiq dars o'tkaziladi.", date:todayISO(), author:"Administrator"}
  ];
  return {users, groups, grades, attendance, homework, announcements};
}
const demoDB = () => JSON.parse(localStorage.getItem(KEY));
const demoSave = d => localStorage.setItem(KEY, JSON.stringify(d));
function matches(doc, f){
  const [k, op, v] = f, x = doc[k];
  if(op === "==") return x === v;
  if(op === "array-contains") return Array.isArray(x) && x.includes(v);
  if(op === "in") return Array.isArray(v) && v.includes(x);
  return true;
}

const store = {
  async init(){
    if(DEMO){ if(!localStorage.getItem(KEY)) demoSave(seed()); return; }
    if(!window.FB) throw new Error("fb.js fayli topilmadi. index.html va fb.js ni Netlify'ga BIRGA yuklang.");
    const {app, auth, fs} = window.FB;
    const a = app.initializeApp(CONFIG.firebase);
    fbx = {app, auth, fs, db: fs.getFirestore(a), au: auth.getAuth(a)};
  },
  async current(){
    if(DEMO){ const id = sessionStorage.getItem("mk_uid"); return id ? demoDB().users.find(u=>u.id===id) || null : null; }
    const u = await new Promise(res => { const off = fbx.auth.onAuthStateChanged(fbx.au, x => { off(); res(x); }); });
    return u ? this.profile(u.uid) : null;
  },
  async profile(id){
    const s = await fbx.fs.getDoc(fbx.fs.doc(fbx.db, "users", id));
    if(!s.exists()) return null;
    const d = {id, ...s.data()};
    d.role = String(d.role || "").trim().toLowerCase();
    ["viewers","groupIds","childIds"].forEach(k => { if(!Array.isArray(d[k])) d[k] = []; });
    return d;
  },
  async login(email, pw){
    if(DEMO){
      const u = demoDB().users.find(x => x.email.toLowerCase() === email.toLowerCase() && x.password === pw);
      if(!u) throw new Error("Email yoki parol noto'g'ri");
      sessionStorage.setItem("mk_uid", u.id); return u;
    }
    try{
      const c = await fbx.auth.signInWithEmailAndPassword(fbx.au, email, pw);
      const p = await this.profile(c.user.uid);
      if(!p){ await fbx.auth.signOut(fbx.au); throw new Error("Profil topilmadi. Administratorga murojaat qiling."); }
      return p;
    }catch(e){
      const c = e.code || "";
      if(c === "auth/unauthorized-domain") throw new Error("Bu sayt manzili Firebase'da ruxsat etilmagan. Firebase → Authentication → Settings → Authorized domains ga " + location.hostname + " ni qo'shing.");
      if(c === "auth/network-request-failed") throw new Error("Internet yoki Firebase bilan aloqa yo'q. Qayta urinib ko'ring.");
      if(c === "auth/invalid-api-key" || c === "auth/api-key-not-valid") throw new Error("Firebase kaliti noto'g'ri (apiKey). Menga xabar bering.");
      if(c === "auth/operation-not-allowed") throw new Error("Firebase'da Email/Password kirish yoqilmagan (Authentication → Sign-in method).");
      if(c === "auth/too-many-requests") throw new Error("Juda ko'p urinish. Bir necha daqiqa kutib qayta urinib ko'ring.");
      if(c === "auth/invalid-credential" || c === "auth/wrong-password" || c === "auth/user-not-found" || c === "auth/invalid-email") throw new Error("Email yoki parol noto'g'ri");
      if(c.startsWith("auth/")) throw new Error("Kirish xatosi: " + c);
      if(c === "permission-denied") throw new Error("Firestore ruxsat bermadi. Rules ni Publish qilganingizni va users hujjati to'g'riligini tekshiring.");
      throw e;
    }
  },
  async logout(){
    if(DEMO) sessionStorage.removeItem("mk_uid"); else await fbx.auth.signOut(fbx.au);
  },
  async list(col, filters = []){
    if(DEMO) return demoDB()[col].filter(d => filters.every(f => matches(d, f)));
    const {fs, db} = fbx;
    const q = fs.query(fs.collection(db, col), ...filters.map(f => fs.where(...f)));
    return (await fs.getDocs(q)).docs.map(d => ({id:d.id, ...d.data()}));
  },
  async set(col, id, obj){
    if(DEMO){
      const db = demoDB(), i = db[col].findIndex(x=>x.id===id);
      const doc = {...obj, id};
      if(i >= 0) db[col][i] = doc; else db[col].push(doc);
      demoSave(db); return id;
    }
    await fbx.fs.setDoc(fbx.fs.doc(fbx.db, col, id), obj); return id;
  },
  async add(col, obj){ return this.set(col, uid(), obj); },
  async update(col, id, part){
    if(DEMO){
      const db = demoDB(), i = db[col].findIndex(x=>x.id===id);
      if(i >= 0){ db[col][i] = {...db[col][i], ...part}; demoSave(db); } return;
    }
    await fbx.fs.updateDoc(fbx.fs.doc(fbx.db, col, id), part);
  },
  async del(col, id){
    if(DEMO){ const db = demoDB(); db[col] = db[col].filter(x=>x.id!==id); demoSave(db); return; }
    await fbx.fs.deleteDoc(fbx.fs.doc(fbx.db, col, id));
  },
  async resetPassword(email){
    if(DEMO) throw new Error("Demo rejimda parol xati yuborilmaydi");
    await fbx.auth.sendPasswordResetEmail(fbx.au, email);
  },
  // Administrator yangi foydalanuvchi yaratadi (o'zi tizimdan chiqib ketmaydi)
  async createUser(email, pw, profile){
    if(DEMO){
      if(demoDB().users.some(u=>u.email.toLowerCase()===email.toLowerCase())) throw new Error("Bu email band");
      const id = uid(); await this.set("users", id, {...profile, email, password: pw}); return id;
    }
    const sec = fbx.app.initializeApp(CONFIG.firebase, "sec" + Date.now());
    const sauth = fbx.auth.getAuth(sec);
    try{
      const c = await fbx.auth.createUserWithEmailAndPassword(sauth, email, pw);
      await this.set("users", c.user.uid, {...profile, email});
      return c.user.uid;
    }catch(e){
      if(e.code === "auth/email-already-in-use") throw new Error("Bu email band");
      if(e.code === "auth/weak-password") throw new Error("Parol kamida 6 belgi bo'lsin");
      throw e;
    }finally{ await fbx.auth.signOut(sauth); }
  }
};

/* ============================================================
   HOLAT
   ============================================================ */
const S = {
  view:"landing", user:null, tab:"", D:{}, child:null, group:null, date:todayISO(),
  draft:{}, err:"", rangeAll:false, editUser:null, bulk:null
};
const TABS = {
  student:[["overview","Umumiy"],["grades","Baholar"],["attendance","Davomat"],["schedule","Dars jadvali"],["homework","Uy vazifalari"],["news","E'lonlar"]],
  parent:[["overview","Umumiy"],["grades","Baholar"],["attendance","Davomat"],["schedule","Dars jadvali"],["homework","Uy vazifalari"],["news","E'lonlar"]],
  teacher:[["t_att","Davomat"],["t_grades","Baholar"],["t_hw","Uy vazifalari"],["schedule","Dars jadvali"],["news","E'lonlar"]],
  admin:[["a_stats","Umumiy"],["a_users","Foydalanuvchilar"],["a_groups","Guruhlar"],["news","E'lonlar"]]
};

async function loadData(){
  const u = S.user, D = {};
  const admin = u.role === "admin", teacher = u.role === "teacher";
  // Baho va davomat oy bo'yicha yuklanadi (o'qishlarni kamaytirish uchun)
  const byMonth = async (col, base) => S.rangeAll
    ? store.list(col, base)
    : (await Promise.all(recentMonths(2).map(m => store.list(col, [...base, ["month","==",m]])))).flat();
  const groups = await store.list("groups");
  let users, grades, attendance;
  if(admin){
    [users, grades, attendance] = await Promise.all([store.list("users"), byMonth("grades", []), byMonth("attendance", [])]);
  } else if(teacher){
    const mine = groups.filter(g=>g.teacherId===u.id).map(g=>g.id);
    const per = async col => (await Promise.all(mine.map(gid => byMonth(col, [["groupId","==",gid]])))).flat();
    const us = await Promise.all(mine.map(gid => store.list("users", [["groupIds","array-contains",gid]])));
    users = [...new Map([...us.flat(), u].map(x=>[x.id,x])).values()];
    [grades, attendance] = await Promise.all([per("grades"), per("attendance")]);
  } else {
    const v = [["viewers","array-contains",u.id]];
    [users, grades, attendance] = await Promise.all([store.list("users", v), store.list("grades", v), store.list("attendance", v)]);
  }
  const [homework, announcements] = await Promise.all([store.list("homework"), store.list("announcements")]);
  Object.assign(D, {users, groups, grades, attendance, homework, announcements});
  users.forEach(x=>{ x.role = String(x.role||"").trim().toLowerCase(); ["viewers","groupIds","childIds"].forEach(k=>{ if(!Array.isArray(x[k])) x[k]=[]; }); });
  groups.forEach(g=>{ if(!Array.isArray(g.days)) g.days=[]; });
  announcements.sort((a,b)=> (b.date||"").localeCompare(a.date||""));
  homework.sort((a,b)=> (b.due||"").localeCompare(a.due||""));
  S.D = D;
  if(u.role === "student") S.child = u.id;
  if(u.role === "parent"){
    const kids = users.filter(x=>x.role==="student");
    if(!kids.find(k=>k.id===S.child)) S.child = kids[0]?.id || null;
  }
  if(u.role === "teacher"){
    const mg = groups.filter(g=>g.teacherId===u.id);
    if(!mg.find(g=>g.id===S.group)) S.group = mg[0]?.id || null;
  }
}
async function reload(){ await loadData(); render(); }

const kids = () => S.D.users.filter(x=>x.role==="student");
const childObj = () => kids().find(k=>k.id===S.child);
function childPicker(){
  if(S.user.role !== "parent") return "";
  const ks = kids();
  if(!ks.length) return `<div class="card empty">Sizga hali farzand biriktirilmagan. Administratorga murojaat qiling.</div>`;
  return `<div class="sel-row"><div><label>Farzand</label><select onchange="S.child=this.value;render()">${ks.map(k=>`<option value="${k.id}" ${k.id===S.child?"selected":""}>${esc(k.name)}</option>`).join("")}</select></div></div>`;
}
const needChild = () => (S.user.role==="parent" && !childObj());
const cGrades = () => S.D.grades.filter(g=>g.studentId===S.child).sort((a,b)=>b.date.localeCompare(a.date));
const cAtt = () => S.D.attendance.filter(a=>a.studentId===S.child).sort((a,b)=>b.date.localeCompare(a.date));
const attStats = list => {
  const p = list.filter(a=>a.status==="present").length, l = list.filter(a=>a.status==="late").length, ab = list.filter(a=>a.status==="absent").length;
  return {p, l, ab, total:list.length, rate: list.length ? Math.round((p+l)/list.length*100) : 0};
};

  if(needChild()) return childPicker();
  const g = cGrades(), a = cAtt(), st = attStats(a), ch = childObj();
  const bySubj = {}; g.forEach(x => (bySubj[x.subject] = bySubj[x.subject] || []).push(x.value));
  const lastAbs = a.filter(x=>x.status==="absent").slice(0,5);
  const wd = (new Date().getDay()+6)%7;
  const myGroups = S.D.groups.filter(x=>(ch?.groupIds||[]).includes(x.id));
  const today = myGroups.filter(x=>(x.days||[]).includes(wd));
  return `${childPicker()}
  <h2>${S.user.role==="parent" ? esc(ch?.name||"") + " — ko'rsatkichlar" : "Mening ko'rsatkichlarim"}</h2>
  <div class="kpis">
    <div class="kpi gold"><small>O'rtacha baho</small><b>${g.length ? avg(g.map(x=>x.value)).toFixed(1) : "—"}</b></div>
    <div class="kpi ${st.rate>=85?"ok":st.rate>=70?"warn":"bad"}"><small>Davomat</small><b>${st.total ? st.rate+"%" : "—"}</b></div>
    <div class="kpi bad"><small>Qoldirilgan darslar</small><b>${st.ab}</b></div>
    <div class="kpi warn"><small>Kechikishlar</small><b>${st.l}</b></div>
  </div>
  <div class="grid g2">
    <div class="card"><h3 style="margin-bottom:16px">Fanlar bo'yicha o'rtacha</h3>
      ${Object.keys(bySubj).length ? Object.entries(bySubj).map(([s,v])=>{const m=avg(v);return `<div class="subj"><div class="t"><span>${esc(s)}</span><b>${m.toFixed(1)}</b></div><div class="bar"><i style="width:${Math.min(100,pct(m))}%"></i></div></div>`}).join("") : `<div class="empty">Hali baho yo'q</div>`}
    </div>
    <div class="card"><h3 style="margin-bottom:12px">Bugungi darslar</h3>
      ${today.length ? today.map(x=>`<div class="lesson"><b>${esc(x.subject)}</b><span>${esc(x.time)} · ${esc(x.teacherName)}</span></div>`).join("") : `<div class="empty">Bugun dars yo'q</div>`}
      <h3 style="margin:18px 0 8px">So'nggi qoldirilgan darslar</h3>
      ${lastAbs.length ? lastAbs.map(x=>`<div class="mini"><span>${esc(x.subject)}</span><span class="pill p-bad">${fmtDate(x.date)}</span></div>`).join("") : `<div class="empty">Qoldirilgan dars yo'q 🎉</div>`}
    </div>
  </div>
  <div class="card" style="margin-top:20px"><h3 style="margin-bottom:6px">So'nggi e'lonlar</h3>${newsList(S.D.announcements.slice(0,3))}</div>`;
}
function vGrades(){
  if(needChild()) return childPicker();
  const g = cGrades();

    ${g.map(x=>`<tr><td>${fmtDate(x.date)}</td><td>${esc(x.subject)}</td><td>${esc(x.topic)}</td><td>${esc(x.teacherName)}</td><td><span class="pill ${gradeClass(x.value)}">${x.value} / ${CONFIG.maxGrade}</span></td></tr>`).join("")}</table>` : `<div class="empty">Hali baho qo'yilmagan</div>`}</div>`;

async function postNews(){

/* ---------- O'qituvchi ---------- */
const myGroups = () => S.user.role==="admin" ? S.D.groups : S.D.groups.filter(g=>g.teacherId===S.user.id);
const grpStudents = gid => S.D.users.filter(u=>u.role==="student" && (u.groupIds||[]).includes(gid));
function groupPicker(extra=""){
  const gs = myGroups();
  if(!gs.length) return `<div class="card empty">Sizga hali guruh biriktirilmagan. Administratorga murojaat qiling.</div>`;
  return `<div class="sel-row"><div><label>Guruh</label><select onchange="S.group=this.value;S.draft={};render()">${gs.map(g=>`<option value="${g.id}" ${g.id===S.group?"selected":""}>${esc(g.name)}</option>`).join("")}</select></div>${extra}</div>`;
}
function tAtt(){
  const gs = myGroups(); if(!gs.length) return groupPicker();
  const g = gs.find(x=>x.id===S.group) || gs[0]; S.group = g.id;
  const studs = grpStudents(g.id);
  const saved = {}; S.D.attendance.filter(a=>a.groupId===g.id && a.date===S.date).forEach(a=>saved[a.studentId]=a.status);
  const cur = id => S.draft[id] || saved[id] || "";
  const dateF = `<div><label>Sana</label><input type="date" value="${S.date}" onchange="S.date=this.value;S.draft={};render()"></div>`;
  return `<h2>Davomat belgilash</h2>${groupPicker(dateF)}
  <div class="card scroll">${studs.length ? `<table><tr><th>O'quvchi</th><th>Holat</th></tr>
    ${studs.map(s=>`<tr><td>${esc(s.name)}</td><td><div class="seg">${["present","absent","late"].map(k=>`<button class="${cur(s.id)===k?"on-"+k:""}" onclick="setAtt('${s.id}','${k}')">${ST[k]}</button>`).join("")}</div></td></tr>`).join("")}</table>
    <div style="margin-top:16px;display:flex;gap:10px"><button class="btn btn-line btn-sm" onclick="markAll()">Hammasi keldi</button><button class="btn btn-gold btn-sm" onclick="saveAtt()">Saqlash</button></div>` : `<div class="empty">Bu guruhda o'quvchi yo'q</div>`}</div>`;
}
function setAtt(id, st){ S.draft[id] = st; render(); }
function markAll(){ grpStudents(S.group).forEach(s=>S.draft[s.id]="present"); render(); }
async function saveAtt(){
  const g = S.D.groups.find(x=>x.id===S.group), studs = grpStudents(S.group);
  const saved = {}; S.D.attendance.filter(a=>a.groupId===g.id && a.date===S.date).forEach(a=>saved[a.studentId]=a.status);
  const todo = studs.filter(s => (S.draft[s.id] || saved[s.id]));
  if(!todo.length) return toast("Avval holatni belgilang", true);
  try{
    await Promise.all(todo.map(s => store.set("attendance", `${g.id}_${s.id}_${S.date}`,
      {studentId:s.id, groupId:g.id, subject:g.subject, date:S.date, month:S.date.slice(0,7), status:S.draft[s.id]||saved[s.id], viewers:s.viewers||[s.id]})));
    S.draft = {}; toast("Davomat saqlandi"); reload();
  }catch(e){ toast("Xatolik: "+e.message, true); }
}
function tGrades(){
  const gs = myGroups(); if(!gs.length) return groupPicker();
  const g = gs.find(x=>x.id===S.group) || gs[0]; S.group = g.id;
  const studs = grpStudents(g.id), list = S.D.grades.filter(x=>x.groupId===g.id).sort((a,b)=>b.date.localeCompare(a.date)).slice(0,40);
  return `<h2>Baholar</h2>${groupPicker()}
  <div class="card" style="margin-bottom:20px"><h3 style="font-size:18px;margin-bottom:12px">Baho qo'yish</h3>
    <div class="form-row">
      <div><label>O'quvchi</label><select id="gs">${studs.map(s=>`<option value="${s.id}">${esc(s.name)}</option>`).join("")}</select></div>
      <div><label>Mavzu</label><input id="gt" placeholder="Masalan: Unit 5 testi"></div>
      <div><label>Baho (0–${CONFIG.maxGrade})</label><input id="gv" type="number" min="0" max="${CONFIG.maxGrade}"></div>
      <div><label>Sana</label><input id="gd" type="date" value="${todayISO()}"></div>
    </div><button class="btn btn-gold btn-sm" onclick="addGrade()">Saqlash</button></div>
  <div class="card scroll">${list.length ? `<table><tr><th>Sana</th><th>O'quvchi</th><th>Mavzu</th><th>Baho</th><th></th></tr>
    ${list.map(x=>`<tr><td>${fmtDate(x.date)}</td><td>${esc(S.D.users.find(u=>u.id===x.studentId)?.name||"—")}</td><td>${esc(x.topic)}</td><td><span class="pill ${gradeClass(x.value)}">${x.value}</span></td><td><button class="btn btn-bad btn-sm" onclick="delDoc('grades','${x.id}')">×</button></td></tr>`).join("")}</table>` : `<div class="empty">Baholar yo'q</div>`}</div>`;
}
async function addGrade(){
  const sid = $("#gs")?.value, topic = $("#gt").value.trim(), v = Number($("#gv").value), d = $("#gd").value;
  if(!sid || !topic || $("#gv").value==="" || isNaN(v) || v<0 || v>CONFIG.maxGrade || !d) return toast("Hamma maydonni to'g'ri to'ldiring", true);
  const s = S.D.users.find(u=>u.id===sid), g = S.D.groups.find(x=>x.id===S.group);
  try{
    await store.add("grades", {studentId:sid, groupId:g.id, subject:g.subject, topic, value:v, date:d, month:d.slice(0,7), teacherName:S.user.name, viewers:s.viewers||[sid]});
    toast("Baho qo'yildi"); reload();
  }catch(e){ toast("Xatolik: "+e.message, true); }
}
function tHw(){
  const gs = myGroups(); if(!gs.length) return groupPicker();
  const g = gs.find(x=>x.id===S.group) || gs[0]; S.group = g.id;
  const list = S.D.homework.filter(h=>h.groupId===g.id);
  return `<h2>Uy vazifalari</h2>${groupPicker()}
  <div class="card" style="margin-bottom:20px"><h3 style="font-size:18px;margin-bottom:12px">Yangi vazifa</h3>

  <div class="card scroll">${list.length ? `<table><tr><th>Muddat</th><th>Vazifa</th><th></th></tr>${list.map(h=>`<tr><td>${fmtDate(h.due)}</td><td><b>${esc(h.title)}</b><br><span style="color:var(--mute)">${esc(h.desc)}</span></td><td><button class="btn btn-bad btn-sm" onclick="delDoc('homework','${h.id}')">×</button></td></tr>`).join("")}</table>` : `<div class="empty">Vazifa yo'q</div>`}</div>`;
}
async function addHw(){
  const t = $("#hh").value.trim(), x = $("#hx").value.trim(), d = $("#hd").value;
  if(!t || !d) return toast("Sarlavha va muddatni kiriting", true);

}

function aStats(){
  const D = S.D, studs = D.users.filter(u=>u.role==="student"), t = D.users.filter(u=>u.role==="teacher").length;
  const todayAtt = D.attendance.filter(a=>a.date===todayISO()), ts = attStats(todayAtt);
  const abs = {}; D.attendance.filter(a=>a.status==="absent").forEach(a=>abs[a.studentId]=(abs[a.studentId]||0)+1);
  const top = Object.entries(abs).sort((a,b)=>b[1]-a[1]).slice(0,6);
  const lows = studs.map(s=>({s, m:avg(D.grades.filter(g=>g.studentId===s.id).map(g=>g.value)), n:D.grades.filter(g=>g.studentId===s.id).length})).filter(x=>x.n).sort((a,b)=>a.m-b.m).slice(0,6);
  return `<h2>Umumiy statistika</h2>
  <div class="kpis">

    <div class="kpi gold"><small>Guruhlar</small><b>${D.groups.length}</b></div>
    <div class="kpi ${ts.total?(ts.rate>=85?"ok":"warn"):"gold"}"><small>Bugungi davomat</small><b>${ts.total?ts.rate+"%":"—"}</b></div>
  </div>
  <div class="grid g2">
    <div class="card"><h3 style="margin-bottom:12px">Eng ko'p dars qoldirganlar</h3>${top.length ? top.map(([id,n])=>`<div class="mini"><span>${esc(D.users.find(u=>u.id===id)?.name||"—")}</span><span class="pill p-bad">${n} ta</span></div>`).join("") : `<div class="empty">Ma'lumot yo'q</div>`}</div>
    <div class="card"><h3 style="margin-bottom:12px">O'rtacha bahosi past o'quvchilar</h3>${lows.length ? lows.map(x=>`<div class="mini"><span>${esc(x.s.name)}</span><span class="pill ${gradeClass(x.m)}">${x.m.toFixed(1)}</span></div>`).join("") : `<div class="empty">Ma'lumot yo'q</div>`}</div>
  </div>`;
}

    : r==="teacher" ? `<div class="form-row"><div><label>Fani</label><input id="usub"></div></div>` : "";
  const br = S.draft.brole || "student";
  const bulkHint = {student:"Ism Familiya, email, parol, guruh nomi (bir nechta bo'lsa | bilan)", parent:"Ism Familiya, email, parol, o'quvchi emaili (bir nechta bo'lsa | bilan)", teacher:"Ism Familiya, email, parol, fani"}[br];
  const bulkRes = S.bulk ? `<div style="margin-top:12px;font-size:14px"><span class="pill p-ok">${S.bulk.ok} ta qo'shildi</span> ${S.bulk.fail.length?`<span class="pill p-bad">${S.bulk.fail.length} ta xato</span><div style="color:var(--bad);margin-top:8px;white-space:pre-wrap">${esc(S.bulk.fail.join("\n"))}</div>`:""}</div>` : "";
  return `<h2>Foydalanuvchilar</h2>
  ${editUserHTML()}
  <div class="card" style="margin-bottom:20px"><h3 style="font-size:18px;margin-bottom:12px">Yangi foydalanuvchi</h3>
    <div class="form-row">
      <div><label>Rol</label><select id="ur" onchange="S.draft.role=this.value;render()">${["student","parent","teacher"].map(k=>`<option value="${k}" ${k===r?"selected":""}>${ROLE[k]}</option>`).join("")}</select></div>
      <div><label>Ism familiya</label><input id="un"></div>
      <div><label>Email (login)</label><input id="ue" type="email"></div>
      <div><label>Parol (kamida 6 belgi)</label><input id="up" type="text"></div>
    </div>${extra}
    <button class="btn btn-gold btn-sm" onclick="addUser()">Yaratish</button></div>
  <div class="card" style="margin-bottom:20px"><h3 style="font-size:18px;margin-bottom:6px">Ko'pchilikni bittada qo'shish</h3>
    <p style="color:var(--mute);font-size:13px;margin-bottom:12px">Har qatorga bittadan yozing (Excel'dan nusxalab qo'yish mumkin): <b>${esc(bulkHint)}</b></p>
    <div class="form-row"><div><label>Rol</label><select id="br" onchange="S.draft.brole=this.value;render()">${["student","parent","teacher"].map(k=>`<option value="${k}" ${k===br?"selected":""}>${ROLE[k]}</option>`).join("")}</select></div></div>
    <div class="form-row"><div><textarea id="bt" rows="6" placeholder="Aziza Yusupova, aziza@mail.com, parol123, English B1"></textarea></div></div>
    <button class="btn btn-gold btn-sm" id="bbtn" onclick="bulkAdd()">Hammasini qo'shish</button>${bulkRes}</div>
  <div class="card scroll"><table><tr><th>Ism</th><th>Rol</th><th>Email</th><th>Bog'liqlik</th><th></th></tr>
    ${rows.map(u=>`<tr><td>${esc(u.name)}</td><td><span class="pill p-gold">${ROLE[u.role]}</span></td><td>${esc(u.email)}</td><td style="color:var(--mute)">${
      u.role==="student" ? esc((u.groupIds||[]).map(id=>D.groups.find(g=>g.id===id)?.name).filter(Boolean).join(", ")||"—")
      : u.role==="parent" ? esc((u.childIds||[]).map(id=>D.users.find(x=>x.id===id)?.name).filter(Boolean).join(", ")||"—")
      : esc(u.subject||"—")}</td><td style="white-space:nowrap"><button class="btn btn-line btn-sm" onclick="S.editUser='${u.id}';render();window.scrollTo(0,0)">Tahrir</button> <button class="btn btn-line btn-sm" onclick="resetPw('${esc(u.email)}')">Parol xati</button> <button class="btn btn-bad btn-sm" onclick="delUser('${u.id}')">×</button></td></tr>`).join("")}</table></div>
  ${DEMO?"":`<p style="color:var(--mute);font-size:13px;margin-top:10px">Eslatma: foydalanuvchi o'chirilganda uning kirish akkaunti Firebase Console → Authentication bo'limidan alohida o'chiriladi.</p>`}`;
}
async function relink(studentId){
  const D = S.D;
  const parents = (await store.list("users", [["childIds","array-contains",studentId]])).filter(p=>p.role==="parent").map(p=>p.id);
  const viewers = [studentId, ...parents];
  await store.update("users", studentId, {viewers});
  const [g, a] = await Promise.all([store.list("grades",[["studentId","==",studentId]]), store.list("attendance",[["studentId","==",studentId]])]);
  await Promise.all([...g.map(x=>store.update("grades",x.id,{viewers})), ...a.map(x=>store.update("attendance",x.id,{viewers}))]);
}
async function addUser(){
  const role = $("#ur").value, name = $("#un").value.trim(), email = $("#ue").value.trim(), pw = $("#up").value;
  if(!name || !email || pw.length < 6) return toast("Ism, email va parol (6+ belgi) kiriting", true);
  const prof = {role, name, viewers:[]};
  if(role==="student") prof.groupIds = [...document.querySelectorAll("input[name=ug]:checked")].map(x=>x.value);
  if(role==="parent") prof.childIds = [...document.querySelectorAll("input[name=uc]:checked")].map(x=>x.value);
  if(role==="teacher") prof.subject = $("#usub")?.value.trim() || "";
  try{
    const id = await store.createUser(email, pw, prof);
    if(role==="student") await store.update("users", id, {viewers:[id]});
    if(role==="parent") for(const c of prof.childIds) await relink(c);
    S.draft = {}; toast("Foydalanuvchi yaratildi"); reload();
  }catch(e){ toast(e.message, true); }
}
function editUserHTML(){
  const u = S.D.users.find(x=>x.id===S.editUser); if(!u) return "";
  const D = S.D;
  const extra = u.role==="student" ? `<div class="form-row"><div style="grid-column:1/-1"><label>Guruhlar</label><div class="chk">${D.groups.map(g=>`<label><input type="checkbox" name="eg" value="${g.id}" ${(u.groupIds||[]).includes(g.id)?"checked":""}>${esc(g.name)}</label>`).join("")}</div></div></div>`
    : u.role==="parent" ? `<div class="form-row"><div style="grid-column:1/-1"><label>Farzandlari</label><div class="chk">${D.users.filter(x=>x.role==="student").map(s=>`<label><input type="checkbox" name="ec" value="${s.id}" ${(u.childIds||[]).includes(s.id)?"checked":""}>${esc(s.name)}</label>`).join("")}</div></div></div>`
    : u.role==="teacher" ? `<div class="form-row"><div><label>Fani</label><input id="eus" value="${esc(u.subject||"")}"></div></div>` : "";
  return `<div class="card" style="margin-bottom:20px;border-color:var(--gold)"><h3 style="font-size:18px;margin-bottom:12px">Tahrirlash: ${esc(u.email)}</h3>
    <div class="form-row"><div><label>Ism familiya</label><input id="eun" value="${esc(u.name)}"></div></div>${extra}
    <div style="display:flex;gap:10px"><button class="btn btn-gold btn-sm" onclick="saveEdit()">Saqlash</button><button class="btn btn-line btn-sm" onclick="S.editUser=null;render()">Bekor qilish</button></div></div>`;
}
async function saveEdit(){
  const u = S.D.users.find(x=>x.id===S.editUser); if(!u) return;
  const part = {name: $("#eun").value.trim() || u.name};
  if(u.role==="student") part.groupIds = [...document.querySelectorAll("input[name=eg]:checked")].map(x=>x.value);
  if(u.role==="parent") part.childIds = [...document.querySelectorAll("input[name=ec]:checked")].map(x=>x.value);
  if(u.role==="teacher") part.subject = $("#eus").value.trim();
  try{
    await store.update("users", u.id, part);
    if(u.role==="parent"){ for(const c of new Set([...(u.childIds||[]), ...part.childIds])) await relink(c); }
    if(u.role==="teacher"){ for(const g of S.D.groups.filter(x=>x.teacherId===u.id)) await store.update("groups", g.id, {teacherName: part.name}); }
    S.editUser = null; toast("Saqlandi"); reload();
  }catch(e){ toast("Xatolik: "+e.message, true); }
}
async function resetPw(email){
  if(!confirm(email + " manziliga parolni tiklash xati yuborilsinmi?")) return;
  try{ await store.resetPassword(email); toast("Parol xati yuborildi"); }
  catch(e){ toast(e.message, true); }
}
async function bulkAdd(){
  const role = $("#br").value, lines = $("#bt").value.split("\n").map(x=>x.trim()).filter(Boolean);
  if(!lines.length) return toast("Ro'yxat bo'sh", true);
  const D = S.D, res = {ok:0, fail:[]}, btn = $("#bbtn"); btn.disabled = true;
  for(const [i, line] of lines.entries()){
    const [name, email, pw, extra=""] = line.split(/[;,\t]/).map(x=>x.trim());
    btn.textContent = `Qo'shilmoqda… ${i+1}/${lines.length}`;
    try{
      if(!name || !email || !pw || pw.length < 6) throw new Error("ism, email va parol (6+ belgi) kerak");
      const items = extra.split("|").map(x=>x.trim()).filter(Boolean);
      const prof = {role, name, viewers:[]};
      if(role==="student") prof.groupIds = items.map(n => { const g = D.groups.find(x=>x.name.toLowerCase()===n.toLowerCase()); if(!g) throw new Error("guruh topilmadi: "+n); return g.id; });
      if(role==="parent") prof.childIds = items.map(e => { const s = D.users.find(x=>x.role==="student" && (x.email||"").toLowerCase()===e.toLowerCase()); if(!s) throw new Error("o'quvchi topilmadi: "+e); return s.id; });
      if(role==="teacher") prof.subject = items[0] || "";
      const id = await store.createUser(email, pw, prof);
      if(role==="student"){ await store.update("users", id, {viewers:[id]}); D.users.push({...prof, id, email, viewers:[id]}); }
      if(role==="parent") for(const c of prof.childIds) await relink(c);
      res.ok++;
    }catch(e){ res.fail.push(`${i+1}-qator (${email||name||"?"}): ${e.message}`); }
  }
  S.bulk = res; toast(`${res.ok} ta qo'shildi` + (res.fail.length ? `, ${res.fail.length} ta xato` : ""), res.fail.length>0 && res.ok===0);
  await reload();
}
async function delUser(id){
  if(!confirm("Foydalanuvchini o'chirishni tasdiqlaysizmi?")) return;
  const u = S.D.users.find(x=>x.id===id);
  await store.del("users", id);
  if(u?.role==="parent") for(const c of (u.childIds||[])) await relink(c);
  toast("O'chirildi"); reload();
}

    ${S.D.groups.map(g=>`<tr><td><b>${esc(g.name)}</b></td><td>${esc(g.subject)}</td><td>${esc(g.teacherName)}</td><td>${(g.days||[]).map(d=>DS[d]).join(", ")} · ${esc(g.time)}</td><td>${grpStudents(g.id).length}</td><td><button class="btn btn-bad btn-sm" onclick="delDoc('groups','${g.id}')">×</button></td></tr>`).join("")}</table>` : `<div class="empty">Guruhlar yo'q</div>`}</div>`;

async function addGroup(){
  const name = $("#gn").value.trim(), subject = $("#gj").value.trim(), tid = $("#gt2").value, time = $("#gm").value.trim();
  const days = [...document.querySelectorAll("input[name=gd]:checked")].map(x=>Number(x.value));
  if(!name || !subject || !tid || !days.length) return toast("Nom, fan, o'qituvchi va kunlarni kiriting", true);
  const t = S.D.users.find(u=>u.id===tid);
  await store.add("groups", {name, subject, teacherId:tid, teacherName:t.name, days, time});
  toast("Guruh yaratildi"); reload();
}
